[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sacp"
version = "0.2.0"
description = "Sovereign Agentic Context Protocol (SACP) v0.2: Zero-Retention ReBIT v2.0+ Gateway for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SACP Protocol Contributors" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "mcp>=1.2.0",
    "fastapi>=0.110.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
